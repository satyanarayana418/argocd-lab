# DEV overlay: 1 replica, blue page, NodePort 30081
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: hello-web
    count: 1
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.5.0"           # CI (or scripts/simulate-ci-release.sh) changes this line
patches:
  - target:
      kind: Deployment
      name: hello-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Hello from DEV - deployed by Argo CD"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "#34577c"
  - target:
      kind: Service
      name: hello-web
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
