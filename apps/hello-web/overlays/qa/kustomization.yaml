# QA overlay: 2 replicas, amber page, NodePort 30082
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: hello-web
    count: 2
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.5.0"           # promoted from dev by Pull Request
patches:
  - target:
      kind: Deployment
      name: hello-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Hello from QA - deployed by Argo CD"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "#b26a00"
  - target:
      kind: Service
      name: hello-web
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
